<svg xmlns="http://www.w3.org/2000/svg" width="1055" height="1491" viewBox="0 0 1055 1491" role="img" aria-labelledby="titolo descrizione">
  <title id="titolo">Accessibilità: una soglia aperta</title>
  <desc id="descrizione">Un grande varco a tagli obliqui lascia spazio a un cerchio, un quadrato e una capsula differenti. Ricostruzione vettoriale del concept ImageGen, senza titolo e numero editoriali.</desc>
  <g id="fondo-ambra" data-palette="principale" fill="#FFD230">
    <rect width="1055" height="1491"/>
  </g>
  <!-- Il telaio è una singola sagoma piana; i tagli inclinati appartengono
       al disegno originale e non introducono facce o ombre aggiuntive. -->
  <g id="soglia-aperta" data-palette="inchiostro" fill="#2E3138">
    <path id="telaio" d="M55 1075 V598 C55 562 68 537.414 101 528 L420 437 V399 C420 370 430 351.039 456 343 L870 215 C890 208.816 908 204.912 930 216 L1055 279 V288 L775 375 C741 385.564 724 403 724 431 V531 L399 612 C373 618.561 360 638 360 664 V1231 Z"/>
  </g>
  <g id="spazio-condiviso" data-palette="carta" fill="#FFFFFF">
    <path id="passaggio" d="M360 1083 V664 C360 638 373 618.561 399 612 L823 505 C852 497.682 875 510 883 534 C885 540 886 548 886 556 V1189 L1055 1275 V1471 Z"/>
    <!-- Offset esatto di 15 unità dalla capsula: niente quasi-tangenze
         o variazioni accidentali nella fascia bianca di separazione. -->
    <rect id="rispetto-capsula" x="764" y="912" width="185" height="410" rx="92.5"/>
  </g>
  <g id="forme-diverse" data-palette="secondario">
    <circle id="cerchio-viola" fill="#A684FF" cx="499" cy="789" r="126"/>
    <rect id="quadrato-ambra" fill="#FFB900" x="553" y="899" width="215" height="217" rx="31"/>
    <rect id="capsula-inchiostro" data-palette="inchiostro" fill="#2E3138" x="779" y="927" width="155" height="380" rx="77.5"/>
  </g>
</svg>
