<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1694" viewBox="0 0 1200 1694" overflow="hidden" role="img" aria-labelledby="storia-titolo storia-descrizione">
  <title id="storia-titolo">Stratificazioni del design</title>
