<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" viewBox="0 0 560 390" role="img"><title>Prevenzione dell’errore</title><desc>Prima di inviare una mail che cita un allegato assente, il sistema avvisa e offre Aggiungi file oppure Invia comunque. Ricostruzione didattica.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#6e11b0" stroke-width="2"/></marker><marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#1a6018" stroke-width="2"/></marker></defs><rect x="12" y="30" width="500" height="310" rx="20" fill="#faf5ff"/><g transform="translate(40 52) scale(1.3333333333333333)"><path d="M 8 16 l 9 -9 a 3 3 0 0 1 4 4 L 10 22 a 5 5 0 0 1 -7 -7 L 15 3 a 4 4 0 0 1 6 6 L 9 21" stroke="#6e11b0" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="88" y="80" font-size="32" font-weight="600" fill="#6e11b0" text-anchor="start" font-family="Nunito Sans">Allegato mancante</text><text x="40" y="130.0" font-size="29" font-weight="400" fill="#334155" text-anchor="start" font-family="Nunito Sans">Hai scritto «in allegato»,</text><text x="40" y="168.28" font-size="29" font-weight="400" fill="#334155" text-anchor="start" font-family="Nunito Sans">ma non hai aggiunto file.</text><text x="40" y="206.56" font-size="29" font-weight="400" fill="#334155" text-anchor="start" font-family="Nunito Sans">Vuoi inviare comunque?</text><rect x="40" y="254" width="208" height="60" rx="12" fill="#6e11b0"/><text x="144.0" y="293.1" font-size="26" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="Nunito Sans">Aggiungi file</text><rect x="264" y="254" width="220" height="60" rx="12" fill="#f3e8ff"/><text x="374.0" y="292.75" font-size="25" font-weight="600" fill="#6e11b0" text-anchor="middle" font-family="Nunito Sans">Invia comunque</text></svg>
