<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>Le componenti di un test di usabilità</title><desc>Il facilitatore amministra i compiti e osserva e intervista il partecipante. Il partecipante esegue i compiti e dà feedback al facilitatore. Schema rielaborato da Nielsen Norman Group.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#6e11b0" stroke-width="2"/></marker><marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#1a6018" stroke-width="2"/></marker></defs><path d="M 180 198 V 64 H 1020 V 198" stroke="#6e11b0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="43" font-size="29" font-weight="600" fill="#6e11b0" text-anchor="middle" font-family="Nunito Sans">Osserva e intervista</text><path d="M 1020 205 V 132 H 180 V 205" stroke="#1a6018" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/><text x="600" y="116" font-size="29" font-weight="600" fill="#1a6018" text-anchor="middle" font-family="Nunito Sans">Dà feedback</text><path d="M 254 274 H 526" stroke="#6e11b0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="390" y="252" font-size="28" font-weight="600" fill="#6e11b0" text-anchor="middle" font-family="Nunito Sans">Amministra</text><path d="M 946 274 H 674" stroke="#6e11b0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="810" y="252" font-size="28" font-weight="600" fill="#6e11b0" text-anchor="middle" font-family="Nunito Sans">Esegue</text><circle cx="180" cy="274" r="70" fill="#f3e8ff"/><g transform="translate(137 231) scale(3.5833333333333335)"><path d="M 4 14 V 11 a 8 8 0 0 1 16 0 v 7 q 0 4 -6 4 M 2 11 h 4 v 8 H 2 Z M 18 11 h 4 v 8 h -4 Z" stroke="#6e11b0" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="180" y="393" font-size="34" font-weight="700" fill="#6e11b0" text-anchor="middle" font-family="Nunito Sans">Facilitatore</text><text x="180" y="435" font-size="25" font-weight="400" fill="#334155" text-anchor="middle" font-family="Nunito Sans">Guida il partecipante</text><text x="180" y="467" font-size="25" font-weight="400" fill="#334155" text-anchor="middle" font-family="Nunito Sans">lungo il processo</text><circle cx="600" cy="274" r="70" fill="#f3e8ff"/><g transform="translate(557 231) scale(3.5833333333333335)"><path d="M 2 4 h 4 v 4 H 2 Z M 2 12 h 4 v 4 H 2 Z M 2 20 h 4 v 3 H 2 Z M 10 6 h 12 M 10 14 h 12 M 10 22 h 12" stroke="#6e11b0" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="600" y="393" font-size="34" font-weight="700" fill="#6e11b0" text-anchor="middle" font-family="Nunito Sans">Compiti</text><text x="600" y="435" font-size="25" font-weight="400" fill="#334155" text-anchor="middle" font-family="Nunito Sans">Attività realistiche che il</text><text x="600" y="467" font-size="25" font-weight="400" fill="#334155" text-anchor="middle" font-family="Nunito Sans">partecipante potrebbe svolgere</text><text x="600" y="499" font-size="25" font-weight="400" fill="#334155" text-anchor="middle" font-family="Nunito Sans">nella vita reale</text><circle cx="1020" cy="274" r="70" fill="#f3e8ff"/><g transform="translate(977 231) scale(3.5833333333333335)"><circle cx="8" cy="7" r="4" fill="none" stroke="#6e11b0" stroke-width="3"/><path d="M 1 23 v -5 q 7 -8 14 0 v 5 Z M 16 3 h 7 v 8 h -3 l -4 3 Z" stroke="#6e11b0" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1020" y="393" font-size="34" font-weight="700" fill="#6e11b0" text-anchor="middle" font-family="Nunito Sans">Partecipante</text><text x="1020" y="435" font-size="25" font-weight="400" fill="#334155" text-anchor="middle" font-family="Nunito Sans">Utente realistico del prodotto</text><text x="1020" y="467" font-size="25" font-weight="400" fill="#334155" text-anchor="middle" font-family="Nunito Sans">o servizio in fase di studio</text></svg>
