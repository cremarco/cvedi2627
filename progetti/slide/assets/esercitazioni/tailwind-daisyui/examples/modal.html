<!doctype html><html lang="it" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="../render.css"><style>html{font-size:24px}body{margin:0;background:var(--color-base-100);color:var(--color-base-content);font-family:ui-sans-serif,system-ui,sans-serif}.demo-stage{box-sizing:border-box;width:100%;height:420px;padding:32px;display:grid;align-items:center}*,*::before,*::after{animation-play-state:paused!important}table{font-size:24px!important}form{margin:0}dialog .modal-box{max-height:390px}</style></head><body><main class="demo-stage"><button class="btn" onclick="document.getElementById('avviso').showModal()">Apri</button>
<dialog id="avviso" class="modal" aria-labelledby="titolo">
  <div class="modal-box">
    <h2 id="titolo" class="text-xl font-bold">Posto prenotato</h2>
    <p class="py-4">Riceverai le indicazioni via email.</p>
    <form method="dialog">
      <button class="btn">Chiudi</button>
    </form>
  </div>
</dialog></main></body></html>
