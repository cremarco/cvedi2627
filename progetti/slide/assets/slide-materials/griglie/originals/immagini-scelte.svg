<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
<title id="title">Campionamento e inquadratura sono due decisioni</title>
<desc id="desc">Due schemi geometrici originali, senza fotografia. A sinistra la stessa scena e lo stesso taglio sono rappresentati con campionamento simbolico più grosso e più fine; 300 e 600 pixel indicano risorse ipotetiche. A destra una vista ampia e una verticale dedicata conservano lo stesso punto focale: il cerchio giallo sul lato destro. Rettangoli blu e cerchio giallo sono soltanto elementi astratti.</desc>
