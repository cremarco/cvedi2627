<title id="title">La stessa finestra, due contenitori</title>
<desc id="desc">Schema originale. Una finestra larga 1280 pixel CSS contiene due gruppi identici di schede. Nel contenitore da 320 pixel le schede sono impilate; in quello da 640 sono affiancate. La soglia è di 552 pixel CSS sul contenitore. Le larghezze sono rappresentate all’80 per cento; le quote sono simulate.</desc>
