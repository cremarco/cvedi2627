nielsen2012:
  type: Article
  author: Nielsen, Jakob
  title: "Usability 101: Introduction to Usability"
  date: 2012-01-03
  parent:
    type: Blog
    title: "{Nielsen Norman Group}"
  language: en
  url: https://www.nngroup.com/articles/usability-101-introduction-to-usability/

yang2023:
