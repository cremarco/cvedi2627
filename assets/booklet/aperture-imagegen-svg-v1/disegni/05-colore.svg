  <title id="titolo">Colore e significato: campioni e contesti</title>
  <desc id="descrizione">Due quadrati corallo identici appaiono in contesti diversi. Un nastro continuo a diciassette tinte attraversa la pagina lime, con campi scuri, chiari e violetti. Titolo e numero sono composti separatamente.</desc>
