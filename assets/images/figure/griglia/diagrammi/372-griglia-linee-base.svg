<text id="Testo su un ritmo&#10;comune di righe.&#10;Le quote ritornano&#10;fino alla p" fill="#2E3138" style="white-space: pre" xml:space="preserve" font-family="DM Sans" font-size="12" letter-spacing="0em"><tspan x="0" y="39.092">Una riga&#10;</tspan><tspan x="0" y="53.092">segue l&#x2019;altra.&#10;</tspan><tspan x="0" y="67.092">Ogni linea&#10;</tspan><tspan x="0" y="81.092">ha lo stesso&#10;</tspan><tspan x="0" y="95.092">passo di base.&#10;</tspan><tspan x="0" y="109.092">Il testo&#10;</tspan><tspan x="0" y="123.092">continua&#10;</tspan><tspan x="0" y="137.092">senza salti.&#10;</tspan><tspan x="0" y="151.092">Le due&#10;</tspan><tspan x="0" y="165.092">colonne&#10;</tspan><tspan x="0" y="179.092">condividono&#10;</tspan><tspan x="0" y="193.092">le quote.&#10;</tspan><tspan x="0" y="207.092">La struttura&#10;</tspan><tspan x="0" y="221.092">resta comune&#10;</tspan><tspan x="0" y="235.092">anche dopo&#10;</tspan><tspan x="0" y="249.092">un titolo.&#10;</tspan><tspan x="0" y="263.092">Il ritmo&#10;</tspan><tspan x="0" y="277.092">riprende.</tspan></text>
<text id="Testo su un ritmo&#10;comune di righe.&#10;Le quote ritornano&#10;fino alla p_2" fill="#2E3138" style="white-space: pre" xml:space="preserve" font-family="DM Sans" font-size="12" letter-spacing="0em"><tspan x="100.545" y="39.092">Stesso ritmo&#10;</tspan><tspan x="100.545" y="53.092">nelle righe.&#10;</tspan><tspan x="100.545" y="67.092">Le quote&#10;</tspan><tspan x="100.545" y="81.092">ritornano.</tspan></text>
<text id="Titolo" fill="#2E3138" style="white-space: pre" xml:space="preserve" font-family="DM Sans" font-size="14" font-weight="500" letter-spacing="0em"><tspan x="100.545" y="123.092">Titolo</tspan></text>
<text id="Il testo riprende&#10;sulla stessa serie&#10;di riferimenti." fill="#2E3138" style="white-space: pre" xml:space="preserve" font-family="DM Sans" font-size="12" letter-spacing="0em"><tspan x="100.545" y="151.092">Il testo&#10;</tspan><tspan x="100.545" y="165.092">riprende&#10;</tspan><tspan x="100.545" y="179.092">su una quota&#10;</tspan><tspan x="100.545" y="193.092">della stessa&#10;</tspan><tspan x="100.545" y="207.092">serie.&#10;</tspan><tspan x="100.545" y="221.092">Il titolo&#10;</tspan><tspan x="100.545" y="235.092">occupa uno&#10;</tspan><tspan x="100.545" y="249.092">spazio che&#10;</tspan><tspan x="100.545" y="263.092">mantiene&#10;</tspan><tspan x="100.545" y="277.092">il passo.</tspan></text>
