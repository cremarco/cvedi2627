<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1694" viewBox="0 0 1200 1694" role="img" aria-labelledby="titolo descrizione">
  <title id="titolo">Colore: tinte e intersezioni</title>
  <desc id="descrizione">Dischi grandi si sovrappongono usando soltanto la tinta del capitolo, con diverse intensità.</desc>
  <!-- Campiture piatte nel colore del capitolo; i tagli sul bordo sono intenzionali. -->
