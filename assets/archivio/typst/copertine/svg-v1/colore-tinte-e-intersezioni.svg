    <circle cx="80" cy="80" r="650" opacity="0.22"/>
    <circle cx="1120" cy="500" r="650" opacity="0.45"/>
    <circle cx="80" cy="1250" r="650" opacity="0.35"/>
    <circle cx="1120" cy="1694" r="650" opacity="0.2"/>
  </g>
</svg>
