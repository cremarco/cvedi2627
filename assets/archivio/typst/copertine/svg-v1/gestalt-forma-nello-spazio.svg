    <path d="M 1050,350 V 780 A 430,430 0 1 0 620,350 Z" opacity="0.2"/>
    <path d="M 150,1344 V 914 A 430,430 0 1 0 580,1344 Z" opacity="0.2"/>
    <path d="M 1050,1344 H 620 A 430,430 0 1 0 1050,914 Z" opacity="0.42"/>
