<!doctype html><html lang="it" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="../render.css"><style>html{font-size:24px}body{margin:0;background:var(--color-base-100);color:var(--color-base-content);font-family:ui-sans-serif,system-ui,sans-serif}.demo-stage{box-sizing:border-box;width:100%;height:420px;padding:32px;display:grid;align-items:center}*,*::before,*::after{animation-play-state:paused!important}table{font-size:24px!important}form{margin:0}dialog .modal-box{max-height:390px}</style></head><body><main class="demo-stage"><div class="grid gap-6 sm:grid-cols-2">
  <fieldset class="fieldset text-base">
    <legend class="fieldset-legend text-base">Un solo turno</legend>
    <label><input type="radio" name="turno" class="radio" checked> Mattina</label>
    <label><input type="radio" name="turno" class="radio"> Pomeriggio</label>
  </fieldset>
  <fieldset class="fieldset text-base">
    <legend class="fieldset-legend text-base">Materiali desiderati</legend>
    <label><input type="checkbox" class="checkbox"> Slide</label>
    <label><input type="checkbox" class="checkbox"> Esercizi</label>
  </fieldset>
</div></main></body></html>
