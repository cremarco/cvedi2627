<!doctype html><html lang="it" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="../render.css"><style>html{font-size:24px}body{margin:0;background:var(--color-base-100);color:var(--color-base-content);font-family:ui-sans-serif,system-ui,sans-serif}.demo-stage{box-sizing:border-box;width:100%;height:420px;padding:32px;display:grid;align-items:center}*,*::before,*::after{animation-play-state:paused!important}table{font-size:24px!important}form{margin:0}dialog .modal-box{max-height:390px}</style></head><body><main class="demo-stage"><form class="grid max-w-xl gap-4">
  <label for="nome">Nome e cognome</label>
  <input id="nome" name="nome" autocomplete="name"
    class="input w-full" required>
  <label for="email">Email</label>
  <input id="email" name="email" type="email"
    autocomplete="email" class="input w-full" required>
  <button class="btn btn-primary">Iscriviti</button>
</form></main></body></html>
